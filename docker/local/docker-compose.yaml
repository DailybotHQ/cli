# Generated by devcontainer-kit (`dck init`) from .devcontainer/dck.toml.
# Blocks between ">>> dck:" and "<<< dck:" markers are reconciled by `dck init`;
# everything outside them is yours (add backing services after the marked block).
# The compose project is COMPOSE_PROJECT_NAME from docker/local/.env when set
# (the Dailybot platform's shared project, see .env.example), else the name below.
# >>> dck:project >>>
name: cli
# <<< dck:project <<<

services:
  # >>> dck:service >>>
  clivscode:
    build:
      context: ./clivscode
      dockerfile: Dockerfile
      args:
        # The coding-agent CLIs installed in YOUR image: dck.toml [agents] clis,
        # unless you set DCK_AGENT_CLIS (docker/local/.env, the shell, or your host
        # profile's [agents] clis / clis_extra through dck up), plus each
        # INSTALL_<CLI>_CLI=true. Then `dck rebuild`. Every supported CLI is wired.
        DCK_AGENT_CLIS: "${DCK_AGENT_CLIS:-}"
        INSTALL_CLAUDE_CLI: "${INSTALL_CLAUDE_CLI:-false}"
        INSTALL_CODEX_CLI: "${INSTALL_CODEX_CLI:-false}"
        INSTALL_CURSOR_CLI: "${INSTALL_CURSOR_CLI:-false}"
        INSTALL_OPENCODE_CLI: "${INSTALL_OPENCODE_CLI:-false}"
        INSTALL_PI_CLI: "${INSTALL_PI_CLI:-false}"
        INSTALL_CLINE_CLI: "${INSTALL_CLINE_CLI:-false}"
        INSTALL_GROK_CLI: "${INSTALL_GROK_CLI:-false}"
        INSTALL_ANTIGRAVITY_CLI: "${INSTALL_ANTIGRAVITY_CLI:-false}"
    init: true
    working_dir: /workspace
    command: ["sleep", "infinity"]
    volumes:
      - ../..:/workspace:cached
      # Per-project named volumes (compose prefixes them with the project name).
      - state:/home/dev-user/.dck/volumes/state
      - agentkit:/home/dev-user/.dck/volumes/agentkit
      - claude:/home/dev-user/.dck/volumes/claude
      - codex:/home/dev-user/.dck/volumes/codex
      - cursor:/home/dev-user/.dck/volumes/cursor
      - opencode:/home/dev-user/.dck/volumes/opencode
      - pi:/home/dev-user/.dck/volumes/pi
      - cline:/home/dev-user/.dck/volumes/cline
      - grok:/home/dev-user/.dck/volumes/grok
      - antigravity:/home/dev-user/.dck/volumes/antigravity
      # The host's SSH agent (git over SSH, signing) — never a key file. Docker
      # Desktop exposes it at this path; on a Linux host set DCK_HOST_SSH_AUTH_SOCK
      # (dck up and dck rebuild do it from $SSH_AUTH_SOCK). A missing host path
      # fails the start instead of being created.
      - type: bind
        source: ${DCK_HOST_SSH_AUTH_SOCK:-/run/host-services/ssh-auth.sock}
        target: /run/dck/ssh-agent.sock
        bind:
          create_host_path: false
    ports:
      # Loopback only unless dck.toml sets `bind`.
      - "127.0.0.1:22031:22"   # sshd (Herdr, `dck ssh`)
    env_file:
      - path: ./clivscode/.env
        required: false
    environment:
      DCK_USER: dev-user
      DCK_WORKSPACE: /workspace
      DCK_SSH: "1"
      DCK_EDITOR: "1"
      SSH_AUTH_SOCK: /run/dck/ssh-agent.sock
      # Agents layer: one named volume per supported CLI's home, installed or
      # not (persisted by the entrypoint); ak profiles live on the agentkit
      # volume. Every agent launched through ak runs in autonomy (this container
      # is the sandbox). Opt-out — agents ask before acting:
      # set AGENTKIT_PERMISSIONS=ask in ./clivscode/.env (this block is
      # reconciled by `dck init`; the .env is yours).
      DCK_AGENTS: "claude codex cursor opencode pi cline grok antigravity"
      AGENTKIT_PROFILES_DIR: /home/dev-user/.dck/volumes/agentkit/profiles
      DCK_DAILYBOT: "1"
      # Public key(s) dck authorizes for sshd; set by `dck up`, empty otherwise.
      DCK_AUTHORIZED_KEYS: "${DCK_AUTHORIZED_KEYS:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
  # <<< dck:service <<<

  # Agent-workspace satellite (SSH only — the CLI has no HTTP preview port),
  # started by docker/local/docker.sh with its own project
  # (dailybotclilocal_<id>) and docker-compose.satellite-stable.yaml. The
  # "satellite" profile keeps `dck up` and `bash dev.sh up` from starting it.
  clivscodesatellite:
    extends:
      service: clivscode
    container_name: dailybot_clivscodesatellite_${DEVCONTAINER_INSTANCE_ID:-1}
    profiles: ["satellite"]

# >>> dck:volumes >>>
volumes:
  state: {}
  agentkit: {}
  claude: {}
  codex: {}
  cursor: {}
  opencode: {}
  pi: {}
  cline: {}
  grok: {}
  antigravity: {}
# <<< dck:volumes <<<
