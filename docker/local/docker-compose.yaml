name: ${COMPOSE_PROJECT_NAME:-dailybotplatformlocal}

services:
  clivscode: &clivscode
    container_name: dailybot-cli
    init: true
    build:
      # Repo root as build context so the Dockerfile can COPY pyproject.toml,
      # requirements/, and any other repo file. .dockerignore at the root keeps
      # the context lean (no node_modules, no .git, no AI-CLI persistence dirs).
      context: ../..
      dockerfile: ./docker/local/cli/Dockerfile
      args:
        INSTALL_CLAUDE_CLI: ${INSTALL_CLAUDE_CLI:-false}
        INSTALL_CURSOR_CLI: ${INSTALL_CURSOR_CLI:-false}
        INSTALL_CODEX_CLI: ${INSTALL_CODEX_CLI:-false}
        INSTALL_PI_CLI: ${INSTALL_PI_CLI:-false}
        INSTALL_OPENCODE_CLI: ${INSTALL_OPENCODE_CLI:-false}
        INSTALL_CLINE_CLI: ${INSTALL_CLINE_CLI:-false}
        INSTALL_GROK_CLI: ${INSTALL_GROK_CLI:-false}
    working_dir: /workspace
    command: sleep infinity
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DOCKER_DEV_ENV=vscode
      # Host ~/.gitconfig is mounted read-only and only lists /app.
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=safe.directory
      - GIT_CONFIG_VALUE_0=*
    networks:
      - dailybot
    ports:
      # SSH into this container, so a Herdr client on the host can attach to it
      # as a saved machine. Bound to loopback, never every interface. Do not use
      # 2222 — Cursor owns 127.0.0.1:2222 on macOS. Override the host side with
      # HERDR_SSH_HOST_PORT in cli/.env when the default is taken on your machine.
      - '127.0.0.1:${HERDR_SSH_HOST_PORT:-22031}:22'
    env_file:
      - cli/.env
    volumes:
      - ../..:/workspace
      # Persistent data volumes mounted only for dev-user (devcontainer runs as dev-user)
      - claude_data:/home/dev-user/.claude_data
      - codex_data:/home/dev-user/.codex_data
      - cursor_data:/home/dev-user/.cursor_data
      - cline_data:/home/dev-user/.cline_data
      - opencode_data:/home/dev-user/.opencode_data
      - pi_data:/home/dev-user/.pi_data
      - grok_data:/home/dev-user/.grok_data
      - cli_herdr_data:/home/dev-user/.herdr_data
      - dailybot_data:/home/dev-user/.dailybot_data
      - gh_data:/home/dev-user/.gh_data
      # Mount the whole host ~/.ssh as read-only; the entrypoint then copies
      # every id_* private key it finds (plus *.pub, config, known_hosts) into
      # the container's writable ~/.ssh. This is portable across team members
      # regardless of which key names they use locally.
      - ${HOME}/.ssh:/home/dev-user/.ssh_host:ro
      # Host Herdr catalog, read-only. The entrypoint copies endpoints.json
      # into the container on every start. Do not mount this at the real
      # Herdr path: a read-write mount would let the container corrupt it.
      - ${HOME}/.local/state/herdr/client:/home/dev-user/.herdr_client_host:ro
      - ${HOME}/.gitconfig:/home/dev-user/.gitconfig:ro

  # Agent-workspace satellite (SSH only — CLI has no HTTP preview port).
  # COMPOSE_PROJECT_NAME=dailybotclilocal_<id> DEVCONTAINER_INSTANCE_ID=<id>
  clivscodesatellite:
    <<: *clivscode
    container_name: dailybot_clivscodesatellite_${DEVCONTAINER_INSTANCE_ID:-1}
    ports: []

volumes:
  claude_data: {}
  codex_data: {}
  cursor_data: {}        # Cursor CLI session/auth (symlinked to ~/.cursor)
  cline_data: {}         # Cline CLI auth/state
  opencode_data: {}      # OpenCode provider config and sessions
  pi_data: {}            # Pi provider config and sessions
  grok_data: {}          # Grok CLI auth/state
  cli_herdr_data: {}         # Herdr sessions and layout
  dailybot_data: {}      # Dailybot CLI config/auth (~/.config/dailybot, config_local, config_custom)
  gh_data: {}

networks:
  dailybot:
    name: dailybot-project-network
    external: true
